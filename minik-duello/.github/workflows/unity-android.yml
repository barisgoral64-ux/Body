# DENENMEMİŞ ŞABLON: Unity lisansı ve imza anahtarı gerektirir (game-ci). İlk çalıştırmadan önce gözden geçirin.
name: Unity Android (AAB)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: client/Library
          key: Library-Android-${{ hashFiles('client/Packages/manifest.json') }}
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          MINIK_PACKAGE: ${{ vars.MINIK_PACKAGE }}
          MINIK_API_URL: ${{ vars.MINIK_API_URL }}
          MINIK_WS_URL: ${{ vars.MINIK_WS_URL }}
        with:
          projectPath: client
          targetPlatform: Android
          buildMethod: MinikDuello.Editor.ReleaseBuilder.BuildAndroidRelease
          androidExportType: androidAppBundle
          androidKeystoreName: release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_ALIAS_PASS }}
      - uses: actions/upload-artifact@v4
        with:
          name: minik-duello-aab
          path: build/Android
